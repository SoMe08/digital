<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nailsalon</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    model-viewer {
      width: 100%;
      max-width: 600px;
      height: 400px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<h2>3D Modelle</h2>

<div id="models-container"></div>

<script>
  // Einfach hier die Dateinamen ohne Pfad eintragen:
  const modelFiles = [
    { glb: 'eins.glb', usdz: 'eins.usdz' },
    { glb: 'zwei.glb', usdz: 'zwei.usdz' },
    { glb: 'drei.glb', usdz: 'drei.usdz' }
  ];

  const container = document.getElementById('models-container');

  modelFiles.forEach(file => {
    const modelViewer = document.createElement('model-viewer');
    modelViewer.setAttribute('src', file.glb);
    modelViewer.setAttribute('ios-src', file.usdz);
    modelViewer.setAttribute('alt', file.glb.split('.')[0]);
    modelViewer.setAttribute('ar', '');
    modelViewer.setAttribute('auto-rotate', '');
    modelViewer.setAttribute('camera-controls', '');
    modelViewer.setAttribute('ar-modes', 'webxr scene-viewer quick-look');
    modelViewer.setAttribute('environment-image', 'neutral');

    container.appendChild(modelViewer);
  });

  async function checkARCoreCompatibility() {
    const isARCoreSupported = await navigator.xr?.isSessionSupported?.('immersive-ar');
    if (!isARCoreSupported) {
      document.querySelectorAll('model-viewer').forEach(modelViewer => {
        modelViewer.removeAttribute('ar');
        modelViewer.removeAttribute('ar-modes');
      });
      alert('Your device is not compatible with AR features. You can still view the 3D models.');
    }
  }

  document.addEventListener('DOMContentLoaded', checkARCoreCompatibility);
</script>

</body>
</html>
