<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Model Viewer mit AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      #models-container {
        display: flex;
        overflow-x: auto;
        gap: 20px;
        padding: 20px;
      }

      model-viewer {
        flex: 0 0 auto;
        width: 300px;
        height: 300px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div id="models-container"></div>

    <script>
      const modelFiles = [
        { glb: 'eins.glb', usdz: 'eins.usdz' },
        { glb: 'zwei.glb', usdz: 'zwei.usdz' },
        { glb: 'drei.glb', usdz: 'drei.usdz' }
      ];

      const container = document.getElementById('models-container');

      modelFiles.forEach(file => {
        const modelViewer = document.createElement('model-viewer');
        modelViewer.setAttribute('src', file.glb);
        modelViewer.setAttribute('ios-src', file.usdz);
        modelViewer.setAttribute('alt', file.glb.split('.')[0]);
        modelViewer.setAttribute('ar', '');
        modelViewer.setAttribute('ar-modes', 'webxr scene-viewer quick-look');
        modelViewer.setAttribute('auto-rotate', '');
        modelViewer.setAttribute('camera-controls', '');
        modelViewer.setAttribute('environment-image', 'https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr');
        modelViewer.setAttribute('shadow-intensity', '1');
        modelViewer.setAttribute('interaction-prompt', 'auto');

        // Optional: AR-Button explizit anzeigen
        const arButtonStyle = document.createElement('style');
        arButtonStyle.textContent = `
          model-viewer::part(ar-button) {
            background-color: #3f51b5;
            color: white;
            border-radius: 4px;
            padding: 8px 12px;
            border: none;
            font-size: 14px;
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 10;
          }
        `;
        document.head.appendChild(arButtonStyle);

        container.appendChild(modelViewer);
      });
    </script>
  </body>
</html>
