<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Model Viewer mit AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>

      html, body {
       background-color: black;
       margin: 0;
       padding: 0;
       min-height: 100vh;
}
      /* Fancy Headline Style */ 
      .headline {
        font-family: cursive;
        font-size: 100px;         
        color: #FFFFFF;
        text-align: center;
        margin-top: 60px;
        text-shadow: 0 0 10px #e91e63, 0 0 20px #f8bbd0;
        animation: pulse 2s infinite ease-in-out;
      }
      /* ✨ Pulse-Animation */
      @keyframes pulse {
        0%, 100% {
          text-shadow: 0 0 10px #e91e63, 0 0 20px #f8bbd0;
        }
        50% {
          text-shadow: 0 0 20px #ec407a, 0 0 30px #f48fb1;
        }
      

      /* 🧱 Layout für Modelle */
      #models-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 40px;
        padding: 20px;
      }

      /* 🖼️ Größere Modelle mit Hover-Zoom */
      model-viewer {
        width: 400px;
        height: 400px;
        background-color: transparent;
        border-radius: 40px;       
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        opacity: 1;
      }

      model-viewer:hover {
        transform: scale(1.05);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
      }

      /* 📱 Responsiv */
      @media (max-width: 500px)      
          model-viewer {
          width: 300px;
          height: 300px;
        }
        .headline {
          font-size: 48px;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="headline">Virtual Extensions</h1>
    <div id="models-container"></div>

    <script>
      const modelFiles = [
        { glb: 'eins.glb', usdz: 'eins.usdz' },
        { glb: 'zwei.glb', usdz: 'zwei.usdz' },
        { glb: 'drei.glb', usdz: 'drei.usdz' }
      ];

      const container = document.getElementById('models-container');

      modelFiles.forEach(file => {
        const modelViewer = document.createElement('model-viewer');
        modelViewer.setAttribute('src', file.glb);
        modelViewer.setAttribute('ios-src', file.usdz);
        modelViewer.setAttribute('alt', file.glb.split('.')[0]);
        modelViewer.setAttribute('ar', '');
        modelViewer.setAttribute('ar-modes', 'webxr scene-viewer quick-look');
        modelViewer.setAttribute('camera-controls', '');
        modelViewer.setAttribute('environment-image', 'https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr');
        modelViewer.setAttribute('exposure', '1.5');        // hellere Darstellung
        modelViewer.setAttribute('shadow-intensity', '0.3'); // weichere Schatten
        modelViewer.setAttribute('auto-rotate', '');         // optional: Modelle drehen sich automatisch
        modelViewer.setAttribute('shadow-intensity', '1');
        modelViewer.setAttribute('interaction-prompt', 'auto');

        // Nach dem Laden: Kamera rotieren & Material fixen
        modelViewer.addEventListener('load', () => {
          modelViewer.cameraOrbit = '360deg 75deg 2.5m';

          const materials = modelViewer.model?.materials;
          if (materials) {
            materials.forEach(mat => {
              if (mat.pbrMetallicRoughness?.baseColorFactor) {
                mat.pbrMetallicRoughness.baseColorFactor[3] = 1.0;
              }
              mat.alphaMode = 'OPAQUE';
            });
          }
        });

        // Optional: AR-Button Styling
        const arButtonStyle = document.createElement('style');
        arButtonStyle.textContent = `
          model-viewer::part(ar-button) {
            background-color: #e91e63;
            color: white;
            border-radius: 4px;
            padding: 8px 12px;
            border: none;
            font-size: 14px;
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 10;
          }
        `;
        document.head.appendChild(arButtonStyle);

        container.appendChild(modelViewer);
      });
    </script>
  </body>
</html>
